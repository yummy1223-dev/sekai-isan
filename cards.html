<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="世界遺産 フラッシュカード">
<title>世界遺産検定2級 フラッシュカード</title>
<style>
  :root { --primary:#0f766e; --ok:#15803d; --ng:#b91c1c; --bg:#f1f5f9; --text:#0f172a; --sub:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text);
         max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { text-align:center; margin-bottom:12px; }
  h1 { font-size:1.15rem; font-weight:800; }
  #status { font-size:.72rem; color:var(--sub); margin-top:4px; }
  #status.err { color:var(--ng); }
  .toplink { display:inline-block; font-size:.8rem; color:var(--primary); margin-top:6px; text-decoration:none; font-weight:700; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, .chip { font-size:.85rem; padding:8px 10px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; color:var(--text); }
  select { flex:1; min-width:120px; }
  .chip { cursor:pointer; }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  .meta { display:flex; justify-content:space-between; font-size:.8rem; color:var(--sub); margin-bottom:8px; }
  .card { background:#fff; border-radius:18px; padding:22px 20px; box-shadow:0 2px 10px rgba(15,23,42,.07);
          min-height:240px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; user-select:none; }
  .card.back { background:#f0fdfa; border:2px solid #99f6e4; }
  .tag { align-self:flex-start; font-size:.72rem; font-weight:700; color:var(--primary); background:#ccfbf1; padding:2px 10px; border-radius:999px; margin-bottom:14px; }
  .side { font-size:.72rem; color:var(--sub); margin-bottom:6px; }
  .main { font-size:1.2rem; font-weight:700; line-height:1.7; white-space:pre-wrap; }
  .note { margin-top:14px; font-size:.85rem; color:#475569; line-height:1.6; border-top:1px dashed #cbd5e1; padding-top:10px; }
  .hint { text-align:center; font-size:.78rem; color:var(--sub); margin-top:10px; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; padding:13px; border:none; border-radius:14px; font-size:.95rem; font-weight:700; cursor:pointer; }
  .btn-prev { background:#e2e8f0; color:#334155; flex:.7; }
  .btn-ng { background:#fee2e2; color:var(--ng); }
  .btn-ok { background:var(--primary); color:#fff; }
  .btn:disabled { opacity:.4; cursor:default; }
  .summary { text-align:center; font-size:.78rem; color:var(--sub); margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>📇 フラッシュカード</h1>
  <div id="status">読み込み中…</div>
  <a class="toplink" href="./">← クイズへ戻る</a>
</header>

<div class="filters">
  <select id="typeSel" aria-label="種類"></select>
  <button class="chip on" id="shufBtn">ランダム順</button>
  <button class="chip" id="todoBtn">未習得のみ</button>
  <button class="chip" id="revBtn">表裏を入れ替え</button>
</div>

<div class="meta"><span id="counter">- / -</span><span id="score"></span></div>
<div class="card" id="card"></div>
<div class="hint" id="hint">カードをタップすると答えが出ます</div>
<div class="nav">
  <button class="btn btn-prev" id="prevBtn">← 前へ</button>
  <button class="btn btn-ng" id="ngBtn">✗ もう一度</button>
  <button class="btn btn-ok" id="okBtn">✓ 覚えた</button>
</div>
<div class="summary" id="summary"></div>
<div class="summary"><button class="chip" id="resetBtn">学習記録をリセット</button></div>

<script>
// ★ カード用シートを「ウェブに公開」したCSVのURLをここに貼る（空なら cards.csv を読む）
const CARDS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNsuXUWnz0bnzghXk6925RuPtEXoG0hdOLMa0TlHu7HRCx7DtrX0VQObYSTIDfmGqz_RTZbaqMAo5F/pubhtml?gid=304861145&single=true';
const LOCAL_CSV = 'cards.csv';
const CACHE_KEY = 'sekai_cards_csv_cache_v1';
const REC_KEY = 'sekai_cards_records_v1';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let all = [], list = [], idx = 0, rec = {}, shuffleOn = true, todoOnly = false, reverse = false, flipped = false;

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function findCol(h, names) { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; }

// 見出し名で列を探す。必須は「表」「裏」。種類・補足・出典・Noは任意
function parseCards(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const h = rows[0].map((x) => x.trim());
  const col = { no: findCol(h, ['No', 'NO', 'no', '番号', 'ID']), type: findCol(h, ['種類', 'タイプ', '分類']),
    f: findCol(h, ['表', '問い', '問題']), b: findCol(h, ['裏', '答え', '正解']),
    n: findCol(h, ['補足', 'メモ', '解説']), s: findCol(h, ['出典']) };
  if (col.f < 0 || col.b < 0) throw new Error('見出し行に「表」「裏」の列が見つかりません');
  const get = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
  const out = [];
  rows.slice(1).forEach((r) => {
    const f = get(r, col.f), b = get(r, col.b);
    if (!f || !b) return;
    const no = get(r, col.no);
    out.push({ id: no ? 'c' + no : 'c' + f, type: get(r, col.type) || '未分類', f, b, n: get(r, col.n), s: get(r, col.s) });
  });
  return out;
}

function setStatus(msg, err) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

async function load() {
  const url = CARDS_CSV_URL ? CARDS_CSV_URL + (CARDS_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now() : LOCAL_CSV;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const cards = parseCards(text);
    if (!cards.length) throw new Error('カードが0枚でした');
    safeSet(CACHE_KEY, text);
    setStatus((CARDS_CSV_URL ? 'スプレッドシートから' : 'cards.csvから') + cards.length + '枚を読み込みました');
    start(cards);
  } catch (e) {
    const cached = safeGet(CACHE_KEY);
    if (cached) {
      try {
        const cards = parseCards(cached);
        if (cards.length) { setStatus('オフライン：前回取得した' + cards.length + '枚を表示中'); start(cards); return; }
      } catch (e2) {}
    }
    setStatus('読み込みに失敗しました: ' + e.message, true);
    $('card').innerHTML = '<div class="main">データを読み込めません</div>';
  }
}

function start(cards) {
  all = cards;
  try { rec = JSON.parse(safeGet(REC_KEY) || '{}'); } catch (e) { rec = {}; }
  const types = [...new Set(all.map((x) => x.type))];
  $('typeSel').innerHTML = '<option value="all">すべての種類（ミックス）</option>' +
    types.map((s) => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  rebuild();
}

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function rebuild() {
  const t = $('typeSel').value;
  list = all.filter((x) => (t === 'all' || x.type === t) && (!todoOnly || rec[x.id] !== 'ok'));
  if (shuffleOn) shuffleArr(list);
  idx = 0; flipped = false;
  render();
}

function render() {
  updateSummary();
  const has = idx < list.length;
  $('counter').textContent = list.length ? Math.min(idx + 1, list.length) + ' / ' + list.length : '0 / 0';
  $('prevBtn').disabled = idx === 0 || !list.length;
  $('okBtn').disabled = !has; $('ngBtn').disabled = !has;
  if (!list.length) {
    $('card').className = 'card';
    $('card').innerHTML = '<div class="main">' + (todoOnly ? '全部覚えました 🎉' : '該当するカードがありません') + '</div>';
    $('hint').textContent = ''; return;
  }
  if (!has) {
    $('card').className = 'card';
    $('card').innerHTML = '<div class="main" style="text-align:center">ひと通り終わりました 🎉<br><span style="font-size:.9rem;font-weight:400;color:#64748b">「未習得のみ」で復習できます</span></div>';
    $('hint').textContent = ''; return;
  }
  const it = list[idx];
  const front = reverse ? it.b : it.f, back = reverse ? it.f : it.b;
  $('card').className = 'card' + (flipped ? ' back' : '');
  $('card').innerHTML = '<span class="tag">' + esc(it.type) + '</span>' +
    '<div class="side">' + (flipped ? '答え' : '問い') + '</div>' +
    '<div class="main">' + esc(flipped ? back : front) + '</div>' +
    (flipped && it.n ? '<div class="note">' + esc(it.n) + '</div>' : '');
  $('hint').textContent = flipped ? '覚えたか、もう一度かを選んでください' : 'カードをタップすると答えが出ます';
}

function mark(v) {
  if (idx >= list.length) return;
  rec[list[idx].id] = v;
  safeSet(REC_KEY, JSON.stringify(rec));
  idx++; flipped = false; render();
}

function updateSummary() {
  const ok = all.filter((x) => rec[x.id] === 'ok').length;
  const ng = all.filter((x) => rec[x.id] === 'ng').length;
  $('summary').textContent = '累計：覚えた ' + ok + ' ／ もう一度 ' + ng + ' ／ 全 ' + all.length + '枚';
}

$('card').addEventListener('click', () => { if (idx < list.length) { flipped = !flipped; render(); } });
$('okBtn').addEventListener('click', () => mark('ok'));
$('ngBtn').addEventListener('click', () => mark('ng'));
$('prevBtn').addEventListener('click', () => { if (idx > 0) { idx--; flipped = false; render(); } });
$('typeSel').addEventListener('change', rebuild);
$('shufBtn').addEventListener('click', () => { shuffleOn = !shuffleOn; $('shufBtn').classList.toggle('on', shuffleOn); rebuild(); });
$('todoBtn').addEventListener('click', () => { todoOnly = !todoOnly; $('todoBtn').classList.toggle('on', todoOnly); rebuild(); });
$('revBtn').addEventListener('click', () => { reverse = !reverse; $('revBtn').classList.toggle('on', reverse); flipped = false; render(); });
$('resetBtn').addEventListener('click', () => { if (confirm('学習記録をリセットしますか？')) { rec = {}; safeSet(REC_KEY, '{}'); rebuild(); } });

load();
</script>
</body>
</html>
