<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="世界遺産検定2級 お勉強 App">
<title>世界遺産検定2級 お勉強 App</title>
<style>
  :root { --primary:#0f766e; --ok:#15803d; --ng:#b91c1c; --bg:#f1f5f9; --text:#0f172a; --sub:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text);
         max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { text-align:center; margin-bottom:12px; }
  h1 { font-size:1.15rem; font-weight:800; }
  #status { font-size:.72rem; color:var(--sub); margin-top:4px; }
  #status.err { color:var(--ng); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, .chip { font-size:.85rem; padding:8px 10px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; color:var(--text); }
  select { flex:1; min-width:120px; }
  .chip { cursor:pointer; }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  .meta { display:flex; justify-content:space-between; font-size:.8rem; color:var(--sub); margin-bottom:8px; }
  .card { background:#fff; border-radius:18px; padding:20px; box-shadow:0 2px 10px rgba(15,23,42,.07); }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .cat, .lv { font-size:.72rem; font-weight:700; padding:2px 10px; border-radius:999px; }
  .cat { color:var(--primary); background:#ccfbf1; }
  .lv1 { color:#1d4ed8; background:#dbeafe; }
  .lv2 { color:#a16207; background:#fef3c7; }
  .lv3 { color:#b91c1c; background:#fee2e2; }
  .q { font-size:1.05rem; font-weight:700; line-height:1.6; margin-bottom:16px; white-space:pre-wrap; }
  .choice { display:block; width:100%; text-align:left; font-size:.95rem; line-height:1.5; padding:12px 14px; margin-bottom:8px;
            border:1.5px solid #cbd5e1; border-radius:12px; background:#fff; color:var(--text); cursor:pointer; }
  .choice:disabled { cursor:default; }
  .choice.correct { border-color:var(--ok); background:#dcfce7; }
  .choice.wrong { border-color:var(--ng); background:#fee2e2; }
  .exp { display:none; margin-top:12px; padding:12px 14px; border-radius:12px; background:#f8fafc; font-size:.88rem; line-height:1.6; }
  .exp.show { display:block; }
  .exp b.head { display:block; margin-bottom:4px; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; padding:13px; border:none; border-radius:14px; font-size:.95rem; font-weight:700; cursor:pointer; }
  .btn-prev { background:#e2e8f0; color:#334155; }
  .btn-next { background:var(--primary); color:#fff; }
  .btn:disabled { opacity:.4; cursor:default; }
  .summary { text-align:center; font-size:.78rem; color:var(--sub); margin-top:12px; }
  .result { text-align:center; padding:12px 0; }
  .result .big { font-size:2rem; font-weight:800; margin:8px 0; }
</style>
</head>
<body>
<header>
  <h1>世界遺産検定2級 お勉強 App</h1>
  <div id="status">読み込み中…</div>
</header>

<div class="filters">
  <select id="lvSel" aria-label="難易度"></select>
  <select id="catSel" aria-label="分野"></select>
  <select id="srcSel" aria-label="出典（回）"></select>
  <button class="chip" id="ngBtn">間違いのみ</button>
  <button class="chip" id="shufBtn">問題シャッフル</button>
  <button class="chip on" id="cshufBtn">選択肢シャッフル</button>
</div>

<div class="meta"><span id="counter">- / -</span><span id="score"></span></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn btn-prev" id="prevBtn">← 前へ</button>
  <button class="btn btn-next" id="nextBtn">次へ →</button>
</div>
<div class="summary" id="summary"></div>
<div class="summary"><button class="chip" id="resetBtn">学習記録をリセット</button></div>

<script>
// ★ スプレッドシートを「ウェブに公開」したCSVのURLをここに貼る（空なら questions.csv を読む）
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNsuXUWnz0bnzghXk6925RuPtEXoG0hdOLMa0TlHu7HRCx7DtrX0VQObYSTIDfmGqz_RTZbaqMAo5F/pub?gid=0&single=true&output=csv';
const LOCAL_CSV = 'questions.csv';
const CACHE_KEY = 'sekai2_csv_cache_v2';
const REC_KEY = 'sekai2_records_v2';
const LV_LABEL = { 1: '基本', 2: '標準', 3: '難関' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let all = [], list = [], idx = 0, rec = {}, onlyNg = false, shuffleOn = false, choiceShuffle = true;
let ans = {}, orders = {};

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function findCol(h, names) { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; }

function toAnswer(s) {
  s = String(s || '').trim().replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  const k = '①②③④'.indexOf(s.charAt(0));
  return k >= 0 ? k + 1 : parseInt(s, 10);
}

// 見出し名で列を探すので、列の追加・並べ替えをしても動く（出典・確認メモなどは無視）
function parseQuestions(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { list: [], skipped: 0 };
  const h = rows[0].map((x) => x.trim());
  const col = {
    no: findCol(h, ['No', 'NO', 'no', '番号', 'ID']),
    lv: findCol(h, ['難易度', 'レベル']),
    cat: findCol(h, ['分野', 'カテゴリ']),
    q: findCol(h, ['問題文', '問題']),
    c: [1, 2, 3, 4].map((n) => findCol(h, ['選択肢' + n, '選択' + n])),
    ans: findCol(h, ['正解', '答え']),
    exp: findCol(h, ['解説']),
    src: findCol(h, ['出典'])
  };
  if (col.q < 0 || col.ans < 0) throw new Error('見出し行に「問題文」「正解」の列が見つかりません');
  const get = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
  let skipped = 0;
  const out = [];
  rows.slice(1).forEach((r) => {
    if (!r.some((x) => (x || '').trim() !== '')) return;
    const q = get(r, col.q);
    const choices = col.c.map((i) => get(r, i).replace(/^[①②③④]\s*/, ''));
    while (choices.length && !choices[choices.length - 1]) choices.pop();
    const a = toAnswer(get(r, col.ans));
    if (!q || choices.length < 2 || !choices.every(Boolean) || !(a >= 1 && a <= choices.length)) { skipped++; return; }
    const no = get(r, col.no);
    out.push({ id: no ? 'n' + no : 'q' + q, no, lv: parseInt(get(r, col.lv), 10) || 0,
               cat: get(r, col.cat) || '未分類', q, choices, ans: a, exp: get(r, col.exp),
               src: (get(r, col.src).split(/\s問/)[0] || '未設定') });
  });
  return { list: out, skipped };
}

function setStatus(msg, err) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

async function load() {
  const url = SHEET_CSV_URL ? SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now() : LOCAL_CSV;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const p = parseQuestions(text);
    if (!p.list.length) throw new Error('問題が0件でした');
    safeSet(CACHE_KEY, text);
    setStatus((SHEET_CSV_URL ? 'スプレッドシートから' : 'questions.csvから') + p.list.length + '問を読み込みました' +
              (p.skipped ? '（形式エラーで読み飛ばした行: ' + p.skipped + '）' : ''), p.skipped > 0);
    start(p.list);
  } catch (e) {
    const cached = safeGet(CACHE_KEY);
    if (cached) {
      try {
        const p = parseQuestions(cached);
        if (p.list.length) { setStatus('オフライン：前回取得した' + p.list.length + '問を表示中'); start(p.list); return; }
      } catch (e2) {}
    }
    setStatus('読み込みに失敗しました: ' + e.message + '（公開したURLから開いてください）', true);
    $('card').innerHTML = '<div class="q">データを読み込めません</div>';
  }
}

function start(qs) {
  all = qs;
  try { rec = JSON.parse(safeGet(REC_KEY) || '{}'); } catch (e) { rec = {}; }
  const lvs = [...new Set(all.map((x) => x.lv))].filter((n) => n > 0).sort((a, b) => a - b);
  $('lvSel').innerHTML = '<option value="all">すべての難易度</option>' +
    lvs.map((n) => '<option value="' + n + '">難易度' + n + (LV_LABEL[n] ? '（' + LV_LABEL[n] + '）' : '') + '</option>').join('');
  const cats = [...new Set(all.map((x) => x.cat))];
  $('catSel').innerHTML = '<option value="all">すべての分野</option>' + cats.map((s) => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  const srcs = [...new Set(all.map((x) => x.src))];
  $('srcSel').innerHTML = '<option value="all">すべての出典</option>' + srcs.map((s) => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  rebuild();
}

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function getOrder(it) {
  if (!orders[it.id]) { const o = it.choices.map((_, i) => i); if (choiceShuffle) shuffleArr(o); orders[it.id] = o; }
  return orders[it.id];
}

function rebuild() {
  const lv = $('lvSel').value, c = $('catSel').value, sr = $('srcSel').value;
  list = all.filter((x) => (lv === 'all' || x.lv === parseInt(lv, 10)) && (c === 'all' || x.cat === c) && (sr === 'all' || x.src === sr) && (!onlyNg || rec[x.id] === 'ng'));
  if (shuffleOn) shuffleArr(list);
  idx = 0; ans = {}; orders = {};
  render();
}

function updateScore() {
  let done = 0, ok = 0;
  for (const k in ans) { done++; if (ans[k].ok) ok++; }
  $('score').textContent = done ? '今回 ' + ok + ' / ' + done + ' 正解' : '';
}

function setNextLabel() { $('nextBtn').textContent = idx === list.length - 1 ? '結果を見る' : '次へ →'; }

function render() {
  updateSummary();
  if (!list.length) {
    $('counter').textContent = '0 / 0'; $('score').textContent = '';
    $('card').innerHTML = '<div class="q">' + (onlyNg ? '間違えた問題はありません 🎉' : '該当する問題がありません') + '</div>';
    $('prevBtn').disabled = true; $('nextBtn').disabled = true; return;
  }
  if (idx >= list.length) { renderResult(); return; }
  const it = list[idx], order = getOrder(it);
  $('counter').textContent = (idx + 1) + ' / ' + list.length;
  updateScore();
  $('prevBtn').disabled = idx === 0;
  $('card').innerHTML =
    '<div class="tags"><span class="cat">' + esc(it.cat) + '</span>' +
    (it.lv ? '<span class="lv lv' + it.lv + '">難易度' + it.lv + (LV_LABEL[it.lv] ? ' ' + LV_LABEL[it.lv] : '') + '</span>' : '') + '</div>' +
    '<div class="q">' + md(it.q) + '</div>' +
    order.map((oi, pos) => '<button class="choice" data-o="' + oi + '">' + (pos + 1) + '. ' + esc(it.choices[oi]) + '</button>').join('') +
    '<div class="exp" id="exp"></div>';
  document.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => answer(parseInt(b.dataset.o, 10))));
  if (ans[it.id]) showResult(it); else { $('nextBtn').disabled = true; setNextLabel(); }
}

function answer(o) {
  const it = list[idx];
  if (ans[it.id]) return;
  const ok = o + 1 === it.ans;
  ans[it.id] = { o, ok };
  rec[it.id] = ok ? 'ok' : 'ng';
  safeSet(REC_KEY, JSON.stringify(rec));
  showResult(it);
  updateScore();
  updateSummary();
}

function showResult(it) {
  const a = ans[it.id], order = getOrder(it), correct = it.ans - 1;
  document.querySelectorAll('.choice').forEach((b) => {
    const o = parseInt(b.dataset.o, 10);
    b.disabled = true;
    if (o === correct) b.classList.add('correct'); else if (o === a.o) b.classList.add('wrong');
  });
  const e = $('exp');
  e.innerHTML = '<b class="head">' + (a.ok ? '⭕ 正解！' : '❌ 不正解（正解は ' + (order.indexOf(correct) + 1) + '）') + '</b>' + md(it.exp || '');
  e.classList.add('show');
  $('nextBtn').disabled = false;
  setNextLabel();
}

function renderResult() {
  let done = 0, ok = 0;
  for (const k in ans) { done++; if (ans[k].ok) ok++; }
  const pct = done ? Math.round((ok / done) * 100) : 0;
  $('counter').textContent = list.length + ' / ' + list.length;
  $('card').innerHTML = '<div class="result"><div>今回の結果</div><div class="big">' + ok + ' / ' + done + '（' + pct + '%）</div>' +
    '<div style="font-size:.85rem;color:#64748b">「間違いのみ」で復習できます</div></div>';
  $('prevBtn').disabled = false; $('nextBtn').disabled = true; $('nextBtn').textContent = '次へ →';
}

function updateSummary() {
  const ok = all.filter((x) => rec[x.id] === 'ok').length;
  const ng = all.filter((x) => rec[x.id] === 'ng').length;
  $('summary').textContent = '累計：正解済み ' + ok + ' ／ 要復習 ' + ng + ' ／ 全 ' + all.length + '問';
}

$('nextBtn').addEventListener('click', () => { idx++; render(); });
$('prevBtn').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
$('lvSel').addEventListener('change', rebuild);
$('catSel').addEventListener('change', rebuild);
$('srcSel').addEventListener('change', rebuild);
$('ngBtn').addEventListener('click', () => { onlyNg = !onlyNg; $('ngBtn').classList.toggle('on', onlyNg); rebuild(); });
$('shufBtn').addEventListener('click', () => { shuffleOn = !shuffleOn; $('shufBtn').classList.toggle('on', shuffleOn); rebuild(); });
$('cshufBtn').addEventListener('click', () => { choiceShuffle = !choiceShuffle; $('cshufBtn').classList.toggle('on', choiceShuffle); rebuild(); });
$('resetBtn').addEventListener('click', () => { if (confirm('学習記録をリセットしますか？')) { rec = {}; safeSet(REC_KEY, '{}'); rebuild(); } });

load();
</script>
</body>
</html>
